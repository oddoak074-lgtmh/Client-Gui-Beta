          cat > src/main/java/com/rainbow/client/CoordsModule.java <<'EOF'
          package com.rainbow.client;
          public class CoordsModule extends TextModule {
              private int lx = Integer.MIN_VALUE, ly, lz;
              public CoordsModule() { super("Coordinates", 6, 54); }
              @Override public void onTick() {
                  if (mc.thePlayer == null) return;
                  int px = (int)Math.floor(mc.thePlayer.posX);
                  int py = (int)Math.floor(mc.thePlayer.posY);
                  int pz = (int)Math.floor(mc.thePlayer.posZ);
