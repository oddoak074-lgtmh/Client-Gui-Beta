          cat > src/main/java/com/rainbow/client/Config.java <<'EOF'
          package com.rainbow.client;
          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;
          import net.minecraft.client.Minecraft;
          public final class Config {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private Config() {}
              private static File file() { return new File(Minecraft.getMinecraft().mcDataDir, "config/rainbowclient.json"); }
              public static void save() {
                  try {
                      File f = file();
                      File parent = f.getParentFile();
                      if (!parent.exists() && !parent.mkdirs()) return;
                      JsonObject root = new JsonObject();
                      root.addProperty("rainbow", Rainbow.enabled);
                      root.addProperty("speed", Rainbow.speed);
                      root.addProperty("background", Settings.background);
                      JsonObject mods = new JsonObject();
                      for (Module m : Modules.all()) {
                          JsonObject o = new JsonObject();
                          o.addProperty("enabled", m.enabled);
                          o.addProperty("x", m.x);
                          o.addProperty("y", m.y);
                          mods.add(m.name, o);
                      }
                      root.add("modules", mods);
                      try (FileWriter writer = new FileWriter(f)) { GSON.toJson(root, writer); }
                  } catch (Exception ignored) {}
              }
              public static void load() {
                  try {
                      File f = file();
                      if (!f.exists()) return;
                      JsonObject root;
                      try (FileReader reader = new FileReader(f)) { root = new JsonParser().parse(reader).getAsJsonObject(); }
                      if (root.has("rainbow")) Rainbow.enabled = root.get("rainbow").getAsBoolean();
                      if (root.has("speed")) Rainbow.speed = root.get("speed").getAsFloat();
                      if (root.has("background")) Settings.background = root.get("background").getAsBoolean();
                      if (!root.has("modules")) return;
                      JsonObject mods = root.getAsJsonObject("modules");
                      for (Module m : Modules.all()) {
                          if (!mods.has(m.name)) continue;
                          JsonObject o = mods.getAsJsonObject(m.name);
                          if (o.has("enabled")) m.enabled = o.get("enabled").getAsBoolean();
                          if (o.has("x")) m.x = o.get("x").getAsInt();
                          if (o.has("y")) m.y = o.get("y").getAsInt();
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/HUDEditor.java <<'EOF'
          package com.rainbow.client;
          import java.io.IOException;
          import net.minecraft.client.gui.GuiScreen;
          public class HUDEditor extends GuiScreen {
              private Module drag;
              private int dx, dy;
              @Override public void drawScreen(int mx, int my, float partialTicks) {
                  drawDefaultBackground();
                  for (Module m : Modules.all()) {
                      if (!m.isHud() || !m.enabled) continue;
                      if (m == drag) {
                          m.x = mx - dx; m.y = my - dy;
                          m.x = Math.max(0, Math.min(m.x, width - m.getWidth()));
                          m.y = Math.max(0, Math.min(m.y, height - m.getHeight()));
                      }
                      m.render(true);
                      Gfx.outline(m.x - 1, m.y - 1, m.getWidth() + 2, m.getHeight() + 2,
                          m == drag ? 0xFFFFFFFF : Rainbow.color(0));
                  }
                  drawCenteredString(fontRendererObj, "HUD EDITOR - drag to move | ESC to save", width / 2, height - 20, 0xFFFFFFFF);
                  super.drawScreen(mx, my, partialTicks);
              }
              @Override protected void mouseClicked(int mx, int my, int button) throws IOException {
                  if (button == 0) {
                      for (int i = Modules.all().size() - 1; i >= 0; i--) {
                          Module m = Modules.all().get(i);
                          if (m.isHud() && m.enabled && Gfx.in(mx, my, m.x, m.y, m.getWidth(), m.getHeight())) {
                              drag = m; dx = mx - m.x; dy = my - m.y;
                              break;
                          }
                      }
                  }
                  super.mouseClicked(mx, my, button);
              }
              @Override protected void mouseReleased(int mx, int my, int state) {
                  if (drag != null) { drag = null; Config.save(); }
                  super.mouseReleased(mx, my, state);
              }
              @Override public void onGuiClosed() { Config.save(); }
              @Override public boolean doesGuiPauseGame() { return false; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/ModMenu.java <<'EOF'
          package com.rainbow.client;
          import java.io.IOException;
          import java.util.List;
          import net.minecraft.client.gui.GuiScreen;
          import org.lwjgl.input.Mouse;
          public class ModMenu extends GuiScreen {
              private static final int PW = 320, ROW = 22, BW = 72;
              private int px, py, ph, scroll;
              private void calc() {
                  ph = Math.min(height - 30, 270);
                  px = (width - PW) / 2;
                  py = (height - ph) / 2;
              }
              private int visible() { return Math.max(1, (ph - 66) / ROW); }
              private void clamp() { scroll = Math.max(0, Math.min(scroll, Math.max(0, Modules.all().size() - visible()))); }
              private int bx(int i) { return px + 10 + i * (BW + 4); }
              @Override public void drawScreen(int mx, int my, float partialTicks) {
                  calc(); clamp();
                  drawDefaultBackground();
                  Gfx.rect(px, py, PW, ph, 0xE0141720);
                  for (int i = 0; i < PW; i++) Gfx.rect(px + i, py, 1, 2, Rainbow.color((float)i / PW));
                  fontRendererObj.drawStringWithShadow("RAINBOW CLIENT", px + 10, py + 9, 0xFFFFFFFF);
                  String[] labels = {
                      "Edit HUD",
                      "Rainbow: " + (Rainbow.enabled ? "ON" : "OFF"),
                      "Speed: " + String.format("%.1f", Rainbow.speed),
                      "BG: " + (Settings.background ? "ON" : "OFF")
                  };
                  for (int i = 0; i < 4; i++) {
                      boolean hover = Gfx.in(mx, my, bx(i), py + 24, BW, 16);
                      Gfx.rect(bx(i), py + 24, BW, 16, hover ? 0xFF303640 : 0xFF222630);
                      drawCenteredString(fontRendererObj, labels[i], bx(i) + BW / 2, py + 28, 0xFFFFFFFF);
                  }
                  List<Module> list = Modules.all();
                  int top = py + 48;
                  for (int k = 0; k < visible(); k++) {
                      int idx = scroll + k;
                      if (idx >= list.size()) break;
                      Module m = list.get(idx);
                      int yy = top + k * ROW;
                      boolean hover = Gfx.in(mx, my, px + 10, yy, PW - 20, ROW - 2);
                      Gfx.rect(px + 10, yy, PW - 20, ROW - 2, hover ? 0xFF2A2F3A : 0xFF20232A);
                      Gfx.rect(px + 10, yy, 2, ROW - 2, m.enabled ? Rainbow.color(k * 0.08f) : 0xFF444750);
                      fontRendererObj.drawString(m.name, px + 18, yy + 7, 0xFFFFFFFF);
                      fontRendererObj.drawString(m.category.label, px + 130, yy + 7, 0xFF888888);
                      String s = m.enabled ? "ON" : "OFF";
                      fontRendererObj.drawString(s, px + PW - 18 - fontRendererObj.getStringWidth(s), yy + 7,
                          m.enabled ? Rainbow.color(0) : 0xFF888888);
                  }
                  drawCenteredString(fontRendererObj, "RSHIFT / ESC: close  |  scroll for more", width / 2, py + ph - 12, 0xFF777777);
                  super.drawScreen(mx, my, partialTicks);
              }
              @Override protected void mouseClicked(int mx, int my, int button) throws IOException {
                  calc();
                  if (button == 0) {
                      for (int i = 0; i < 4; i++) {
                          if (Gfx.in(mx, my, bx(i), py + 24, BW, 16)) { action(i); return; }
                      }
                      int top = py + 48;
                      if (my >= top && mx >= px + 10 && mx < px + PW - 10) {
                          int k = (my - top) / ROW;
                          int idx = scroll + k;
                          if (k < visible() && idx < Modules.all().size()) {
                              Modules.all().get(idx).toggle();
                              Config.save();
                              return;
                          }
                      }
                  }
                  super.mouseClicked(mx, my, button);
              }
              private void action(int i) {
                  if (i == 0) { mc.displayGuiScreen(new HUDEditor()); return; }
                  if (i == 1) Rainbow.enabled = !Rainbow.enabled;
                  if (i == 2) { Rainbow.speed += 0.1f; if (Rainbow.speed > 1.01f) Rainbow.speed = 0.1f; }
                  if (i == 3) Settings.background = !Settings.background;
                  Config.save();
              }
              @Override public void handleMouseInput() throws IOException {
                  super.handleMouseInput();
                  int wheel = Mouse.getEventDWheel();
                  if (wheel != 0) { scroll += wheel > 0 ? -1 : 1; clamp(); }
              }
              @Override protected void keyTyped(char typedChar, int keyCode) throws IOException {
                  if (keyCode == RainbowClient.menuKey.getKeyCode()) { mc.displayGuiScreen(null); return; }
                  super.keyTyped(typedChar, keyCode);
              }
              @Override public void onGuiClosed() { Config.save(); }
              @Override public boolean doesGuiPauseGame() { return false; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/RainbowClient.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.settings.KeyBinding;
          import net.minecraftforge.client.event.MouseEvent;
          import net.minecraftforge.client.event.RenderGameOverlayEvent;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.fml.client.registry.ClientRegistry;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.common.event.FMLInitializationEvent;
          import net.minecraftforge.fml.common.eventhandler.SubscribeEvent;
          import net.minecraftforge.fml.common.gameevent.InputEvent;
          import net.minecraftforge.fml.common.gameevent.TickEvent;
          import org.lwjgl.input.Keyboard;
          @Mod(modid = "rainbowclient", name = "Rainbow Client", version = "1.0.0",
               clientSideOnly = true, acceptedMinecraftVersions = "[1.8.9]")
          public class RainbowClient {
              public static KeyBinding menuKey, editKey;
              private final Minecraft mc = Minecraft.getMinecraft();
              @Mod.EventHandler public void init(FMLInitializationEvent event) {
                  menuKey = new KeyBinding("Rainbow Client: Mod Menu", Keyboard.KEY_RSHIFT, "Rainbow Client");
                  editKey = new KeyBinding("Rainbow Client: HUD Editor", Keyboard.KEY_NONE, "Rainbow Client");
                  ClientRegistry.registerKeyBinding(menuKey);
                  ClientRegistry.registerKeyBinding(editKey);
                  ClientRegistry.registerKeyBinding(ZoomModule.KEY);
                  MinecraftForge.EVENT_BUS.register(this);
                  Config.load();
              }
              @SubscribeEvent public void onKey(InputEvent.KeyInputEvent event) {
                  while (menuKey.isPressed()) if (mc.currentScreen == null) mc.displayGuiScreen(new ModMenu());
                  while (editKey.isPressed()) if (mc.currentScreen == null) mc.displayGuiScreen(new HUDEditor());
              }
              @SubscribeEvent public void onTick(TickEvent.ClientTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) return;
                  for (Module m : Modules.all()) m.onTick();
              }
              @SubscribeEvent public void onMouse(MouseEvent event) {
                  if (event.buttonstate) Cps.click(event.button);
              }
              @SubscribeEvent public void onOverlay(RenderGameOverlayEvent.Post event) {
                  if (event.type != RenderGameOverlayEvent.ElementType.TEXT) return;
                  if (mc.gameSettings.showDebugInfo || mc.gameSettings.hideGUI) return;
                  if (mc.currentScreen instanceof HUDEditor) return;
                  for (Module m : Modules.all()) if (m.isHud() && m.enabled) m.render(false);
              }
          }
          EOF

          echo "Generated source files:"
          find src/main -type f -print

      - name: Configure build.gradle (Java 8 + archive name)
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/archivesBaseName = .*/archivesBaseName = \"RainbowClient-1.8.9\"/" build.gradle
          # Forge 1.8.9 MDK mặc định -source 1.6 -> không hỗ trợ try-with-resources
          sed -i -E "s/(sourceCompatibility|targetCompatibility)( *= *)['\"]?1\.6['\"]?/\1\2'1.8'/g" build.gradle
          cat >> build.gradle <<'GRADLE'

          tasks.withType(JavaCompile) {
              sourceCompatibility = '1.8'
              targetCompatibility = '1.8'
              options.encoding = 'UTF-8'
          }
          GRADLE
          chmod +x gradlew

      - name: Build mod
        shell: bash
        run: ./gradlew build --no-daemon --console=plain --stacktrace

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: RainbowClient-Minecraft-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
