          cat > src/main/java/com/rainbow/client/KeystrokesModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.settings.GameSettings;
          public class KeystrokesModule extends Module {
              public KeystrokesModule() {
                  super("Keystrokes", Category.HUD, true, 6, 90);
                  this.w = 64; this.h = 78;
              }
              @Override public boolean isHud() { return true; }
              @Override public void render(boolean preview) {
                  GameSettings g = mc.gameSettings;
                  key(22, 0, 20, 20, "W", !preview && g.keyBindForward.isKeyDown());
                  key(0, 22, 20, 20, "A", !preview && g.keyBindLeft.isKeyDown());
                  key(22, 22, 20, 20, "S", !preview && g.keyBindBack.isKeyDown());
                  key(44, 22, 20, 20, "D", !preview && g.keyBindRight.isKeyDown());
                  key(0, 44, 31, 20, "LMB", !preview && g.keyBindAttack.isKeyDown());
                  key(33, 44, 31, 20, "RMB", !preview && g.keyBindUseItem.isKeyDown());
                  key(0, 66, 64, 12, "SPACE", !preview && g.keyBindJump.isKeyDown());
              }
              private void key(int ox, int oy, int kw, int kh, String label, boolean down) {
                  Gfx.rect(x + ox, y + oy, kw, kh, down ? 0xB0FFFFFF : 0x90000000);
                  int tw = mc.fontRendererObj.getStringWidth(label);
                  mc.fontRendererObj.drawString(label, x + ox + (kw - tw) / 2, y + oy + (kh - 8) / 2,
                      down ? 0xFF000000 : 0xFFFFFFFF);
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/ArmorModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.renderer.GlStateManager;
          import net.minecraft.client.renderer.RenderHelper;
          import net.minecraft.item.ItemStack;
          public class ArmorModule extends Module {
              public ArmorModule() {
                  super("Armor Status", Category.HUD, true, 6, 172);
                  this.w = 50; this.h = 90;
              }
              @Override public boolean isHud() { return true; }
              @Override public void render(boolean preview) {
                  if (mc.thePlayer == null) return;
                  for (int row = 0; row < 5; row++) {
                      ItemStack stack = row < 4 ? mc.thePlayer.inventory.armorInventory[3 - row]
                                                : mc.thePlayer.inventory.getCurrentItem();
                      if (stack == null) continue;
                      int yy = y + row * 18;
                      GlStateManager.pushMatrix();
                      RenderHelper.enableGUIStandardItemLighting();
                      mc.getRenderItem().renderItemAndEffectIntoGUI(stack, x, yy);
                      mc.getRenderItem().renderItemOverlayIntoGUI(mc.fontRendererObj, stack, x, yy, null);
                      RenderHelper.disableStandardItemLighting();
                      GlStateManager.popMatrix();
                      if (stack.isItemStackDamageable()) {
                          int left = stack.getMaxDamage() - stack.getItemDamage();
                          mc.fontRendererObj.drawStringWithShadow(String.valueOf(left), x + 20, yy + 4, 0xFFFFFFFF);
                      }
                  }
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/SprintModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.settings.KeyBinding;
          import org.lwjgl.input.Keyboard;
          public class SprintModule extends Module {
              private boolean held;
              public SprintModule() { super("Toggle Sprint", Category.MOVEMENT, true, 0, 0); }
              @Override public void onTick() {
                  int code = mc.gameSettings.keyBindSprint.getKeyCode();
                  boolean want = enabled && mc.thePlayer != null && mc.currentScreen == null
                      && mc.gameSettings.keyBindForward.isKeyDown() && !mc.thePlayer.isSneaking();
                  if (want) {
                      KeyBinding.setKeyBindState(code, true);
                      held = true;
                  } else if (held) {
                      KeyBinding.setKeyBindState(code, code > 0 && Keyboard.isKeyDown(code));
                      held = false;
                  }
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/ZoomModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.settings.KeyBinding;
          import org.lwjgl.input.Keyboard;
          public class ZoomModule extends Module {
              public static final KeyBinding KEY = new KeyBinding("Rainbow Client: Zoom", Keyboard.KEY_C, "Rainbow Client");
              private boolean zooming;
              private float savedFov;
              public ZoomModule() { super("Zoom", Category.RENDER, true, 0, 0); }
              @Override public void onTick() {
                  boolean want = enabled && mc.thePlayer != null && mc.currentScreen == null && KEY.isKeyDown();
                  if (want && !zooming) {
                      savedFov = mc.gameSettings.fovSetting;
                      mc.gameSettings.fovSetting = Math.max(10.0f, savedFov * 0.3f);
                      mc.gameSettings.smoothCamera = true;
                      zooming = true;
                  } else if (!want && zooming) {
                      mc.gameSettings.fovSetting = savedFov;
                      mc.gameSettings.smoothCamera = false;
                      zooming = false;
                  }
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Modules.java <<'EOF'
