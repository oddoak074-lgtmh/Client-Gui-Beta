name: Rainbow Client 1.8.9 - Auto Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Source and Build Forge Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle / ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-forge-1.8.9-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: gradle-forge-1.8.9-

      - name: Download Forge 1.8.9 MDK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-mdk.zip"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/forge-mdk.zip"
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" -d "$RUNNER_TEMP/forge-mdk"
          test -f "$RUNNER_TEMP/forge-mdk/build.gradle"
          test -f "$RUNNER_TEMP/forge-mdk/gradlew"
          cp -an "$RUNNER_TEMP/forge-mdk/." "$GITHUB_WORKSPACE/"

      - name: Generate project source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf src/main/java/com/rainbow
          mkdir -p src/main/java/com/rainbow/client src/main/resources

          cat > src/main/resources/mcmod.info <<'EOF'
          [
            {
              "modid": "rainbowclient",
              "name": "Rainbow Client",
              "description": "Lunar-style client mod: customizable Keystrokes, FPS, CPS, Armor Status, Toggle Sprint, Zoom and a drag-and-drop HUD editor.",
              "version": "1.1.0",
              "mcversion": "1.8.9"
            }
          ]
          EOF

          cat > src/main/java/com/rainbow/client/Category.java <<'EOF'
          package com.rainbow.client;
          public enum Category {
              HUD("HUD"), MOVEMENT("Movement"), RENDER("Render");
              public final String label;
              Category(String label) { this.label = label; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Settings.java <<'EOF'
          package com.rainbow.client;
          public final class Settings {
              public static boolean background = true;
              private Settings() {}
          }
          EOF

          cat > src/main/java/com/rainbow/client/Setting.java <<'EOF'
          package com.rainbow.client;
          public abstract class Setting {
              public final String name;
              protected Setting(String name) { this.name = name; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/BoolSetting.java <<'EOF'
          package com.rainbow.client;
          public class BoolSetting extends Setting {
              public boolean value;
              public BoolSetting(String name, boolean value) { super(name); this.value = value; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/NumSetting.java <<'EOF'
          package com.rainbow.client;
          public class NumSetting extends Setting {
              public float value;
              public final float min, max, step;
              public NumSetting(String name, float value, float min, float max, float step) {
                  super(name); this.value = value; this.min = min; this.max = max; this.step = step;
              }
              public void set(float v) {
                  v = Math.max(min, Math.min(max, v));
                  if (step > 0) v = Math.round(v / step) * step;
                  value = Math.max(min, Math.min(max, v));
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Gfx.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.gui.Gui;
          import net.minecraft.client.renderer.GlStateManager;
          import net.minecraft.client.renderer.Tessellator;
          import net.minecraft.client.renderer.WorldRenderer;
          import net.minecraft.client.renderer.vertex.DefaultVertexFormats;
          public final class Gfx {
              private static WorldRenderer wr;
              private Gfx() {}

              // Immediate helpers (menus)
              public static void rect(int x, int y, int w, int h, int color) { Gui.drawRect(x, y, x + w, y + h, color); }
              public static void outline(int x, int y, int w, int h, int color) {
                  rect(x, y, w, 1, color); rect(x, y + h - 1, w, 1, color);
                  rect(x, y, 1, h, color); rect(x + w - 1, y, 1, h, color);
              }
              public static boolean in(int mx, int my, int x, int y, int w, int h) {
                  return mx >= x && mx < x + w && my >= y && my < y + h;
              }

              // Batched helpers (HUD): everything between begin() and end() is ONE draw call.
              public static void begin() {
                  GlStateManager.enableBlend();
                  GlStateManager.disableTexture2D();
                  GlStateManager.tryBlendFuncSeparate(770, 771, 1, 0);
                  wr = Tessellator.getInstance().getWorldRenderer();
                  wr.begin(7, DefaultVertexFormats.POSITION_COLOR);
              }
              public static void quad(float x, float y, float w, float h, int c) {
                  int a = (c >> 24) & 255, r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                  wr.pos(x, y + h, 0).color(r, g, b, a).endVertex();
                  wr.pos(x + w, y + h, 0).color(r, g, b, a).endVertex();
                  wr.pos(x + w, y, 0).color(r, g, b, a).endVertex();
                  wr.pos(x, y, 0).color(r, g, b, a).endVertex();
              }
              public static void frame(float x, float y, float w, float h, float t, int c) {
                  quad(x, y, w, t, c);
                  quad(x, y + h - t, w, t, c);
                  quad(x, y + t, t, h - 2 * t, c);
                  quad(x + w - t, y + t, t, h - 2 * t, c);
              }
              public static void end() {
                  Tessellator.getInstance().draw();
                  GlStateManager.enableTexture2D();
                  GlStateManager.disableBlend();
                  GlStateManager.color(1f, 1f, 1f, 1f);
              }
              public static int lerp(int a, int b, float t) {
                  int r = 0;
                  for (int s = 24; s >= 0; s -= 8) {
                      int ca = (a >> s) & 255, cb = (b >> s) & 255;
                      r |= ((int)(ca + (cb - ca) * t) & 255) << s;
                  }
                  return r;
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Rainbow.java <<'EOF'
          package com.rainbow.client;
          import java.awt.Color;
          public final class Rainbow {
              public static boolean enabled = true;
              public static float speed = 0.2f;
              private static final int[] TABLE = new int[360];
              private static float phase;
              static {
                  for (int i = 0; i < 360; i++) TABLE[i] = Color.HSBtoRGB(i / 360f, 0.8f, 1.0f);
              }
              private Rainbow() {}
              /** Call once per frame (overlay / screen) - color() then costs only a table lookup. */
              public static void update() {
                  phase = (float)(((System.currentTimeMillis() / 1000.0) * speed) % 1.0);
              }
              public static int color(float offset) {
                  if (!enabled) return 0xFF63AAFF;
                  float h = (phase + offset) % 1.0f;
                  if (h < 0) h += 1.0f;
                  return TABLE[(int)(h * 359.0f)];
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Cps.java <<'EOF'
          package com.rainbow.client;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          public final class Cps {
              private static final List<Long> LEFT = new ArrayList<Long>();
              private static final List<Long> RIGHT = new ArrayList<Long>();
              private Cps() {}
              public static void click(int button) {
                  long now = System.currentTimeMillis();
                  if (button == 0) LEFT.add(now); else if (button == 1) RIGHT.add(now);
              }
              public static int left() { return count(LEFT); }
              public static int right() { return count(RIGHT); }
              private static int count(List<Long> list) {
                  long now = System.currentTimeMillis();
                  Iterator<Long> it = list.iterator();
                  while (it.hasNext()) if (now - it.next() > 1000L) it.remove();
                  return list.size();
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Module.java <<'EOF'
          package com.rainbow.client;
          import java.util.ArrayList;
          import java.util.List;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.renderer.GlStateManager;
          public class Module {
              public final String name;
              public final Category category;
              public final boolean hud;
              public boolean enabled;
              public int x, y;
              protected int w, h;
              protected final Minecraft mc = Minecraft.getMinecraft();
              public final List<Setting> settings = new ArrayList<Setting>();
              public final NumSetting scale = new NumSetting("Scale", 1.0f, 0.5f, 2.5f, 0.05f);
              public Module(String name, Category category, boolean hud, boolean enabled, int x, int y) {
                  this.name = name; this.category = category; this.hud = hud;
                  this.enabled = enabled; this.x = x; this.y = y;
                  if (hud) settings.add(scale);
              }
              protected BoolSetting bool(String n, boolean def) { BoolSetting s = new BoolSetting(n, def); settings.add(s); return s; }
              protected NumSetting num(String n, float def, float min, float max, float step) {
                  NumSetting s = new NumSetting(n, def, min, max, step); settings.add(s); return s;
              }
              public int getWidth() { return (int)Math.ceil(w * scale.value); }
              public int getHeight() { return (int)Math.ceil(h * scale.value); }
              public final void draw(int ox, int oy, boolean preview) {
                  GlStateManager.pushMatrix();
                  GlStateManager.translate((float)ox, (float)oy, 0f);
                  float s = scale.value;
                  GlStateManager.scale(s, s, 1f);
                  renderLocal(preview);
                  GlStateManager.popMatrix();
              }
              /** Draw at local origin (0,0); scaling/translation is already applied. */
              protected void renderLocal(boolean preview) {}
              public void onTick() {}
              public void toggle() { enabled = !enabled; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/TextModule.java <<'EOF'
          package com.rainbow.client;
          public abstract class TextModule extends Module {
              private String text = "";
              public TextModule(String name, int x, int y) {
                  super(name, Category.HUD, true, true, x, y);
                  this.w = 10; this.h = 13;
              }
              /** Called from onTick only when the value changes - no per-frame string work. */
              protected void set(String t) {
                  if (t.equals(text)) return;
                  text = t;
                  w = mc.fontRendererObj.getStringWidth(t) + 10;
              }
              @Override protected void renderLocal(boolean preview) {
                  Gfx.begin();
                  if (Settings.background) Gfx.quad(0, 0, w, h, 0x90000000);
                  Gfx.quad(0, 0, 2, h, Rainbow.color(0));
                  Gfx.end();
                  mc.fontRendererObj.drawStringWithShadow(text, 6, 3, 0xFFFFFFFF);
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/FpsModule.java <<'EOF'
          package com.rainbow.client;
