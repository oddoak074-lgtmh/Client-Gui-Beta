name: Rainbow Client 1.8.9 - Auto Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Source and Build Forge Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle / ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-forge-1.8.9-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: gradle-forge-1.8.9-

      - name: Download Forge 1.8.9 MDK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-mdk.zip"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/forge-mdk.zip"
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" -d "$RUNNER_TEMP/forge-mdk"
          test -f "$RUNNER_TEMP/forge-mdk/build.gradle"
          test -f "$RUNNER_TEMP/forge-mdk/gradlew"
          cp -an "$RUNNER_TEMP/forge-mdk/." "$GITHUB_WORKSPACE/"

      - name: Generate project source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p src/main/java/com/rainbow/client src/main/resources

          cat > src/main/resources/mcmod.info <<'EOF'
          [
            {
              "modid": "rainbowclient",
              "name": "Rainbow Client",
              "description": "Lunar-style client mod: FPS, CPS, Keystrokes, Armor Status, Toggle Sprint, Zoom and a drag-and-drop HUD editor.",
              "version": "1.0.0",
              "mcversion": "1.8.9"
            }
          ]
          EOF

          cat > src/main/java/com/rainbow/client/Category.java <<'EOF'
          package com.rainbow.client;
          public enum Category {
              HUD("HUD"), MOVEMENT("Movement"), RENDER("Render");
              public final String label;
              Category(String label) { this.label = label; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Settings.java <<'EOF'
          package com.rainbow.client;
          public final class Settings {
              public static boolean background = true;
              private Settings() {}
          }
          EOF

          cat > src/main/java/com/rainbow/client/Gfx.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.gui.Gui;
          public final class Gfx {
              private Gfx() {}
              public static void rect(int x, int y, int w, int h, int color) { Gui.drawRect(x, y, x + w, y + h, color); }
              public static void outline(int x, int y, int w, int h, int color) {
                  rect(x, y, w, 1, color); rect(x, y + h - 1, w, 1, color);
                  rect(x, y, 1, h, color); rect(x + w - 1, y, 1, h, color);
              }
              public static boolean in(int mx, int my, int x, int y, int w, int h) {
                  return mx >= x && mx < x + w && my >= y && my < y + h;
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Rainbow.java <<'EOF'
          package com.rainbow.client;
          import java.awt.Color;
          public final class Rainbow {
              public static boolean enabled = true;
              public static float speed = 0.2f;
              private Rainbow() {}
              public static int color(float offset) {
                  if (!enabled) return 0xFF63AAFF;
                  float hue = (float)(((System.currentTimeMillis() / 1000.0) * speed + offset) % 1.0);
                  if (hue < 0) hue += 1.0f;
                  return Color.HSBtoRGB(hue, 0.8f, 1.0f);
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Cps.java <<'EOF'
          package com.rainbow.client;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          public final class Cps {
              private static final List<Long> LEFT = new ArrayList<Long>();
              private static final List<Long> RIGHT = new ArrayList<Long>();
              private Cps() {}
              public static void click(int button) {
                  long now = System.currentTimeMillis();
                  if (button == 0) LEFT.add(now); else if (button == 1) RIGHT.add(now);
              }
              public static int left() { return count(LEFT); }
              public static int right() { return count(RIGHT); }
              private static int count(List<Long> list) {
                  long now = System.currentTimeMillis();
                  Iterator<Long> it = list.iterator();
                  while (it.hasNext()) if (now - it.next() > 1000L) it.remove();
                  return list.size();
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/Module.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.Minecraft;
          public class Module {
              public final String name;
              public final Category category;
              public boolean enabled;
              public int x, y;
              protected int w, h;
              protected final Minecraft mc = Minecraft.getMinecraft();
              public Module(String name, Category category, boolean enabled, int x, int y) {
                  this.name = name; this.category = category; this.enabled = enabled; this.x = x; this.y = y;
              }
              public boolean isHud() { return false; }
              public int getWidth() { return w; }
              public int getHeight() { return h; }
              public void render(boolean preview) {}
              public void onTick() {}
              public void toggle() { enabled = !enabled; }
          }
          EOF

          cat > src/main/java/com/rainbow/client/TextModule.java <<'EOF'
          package com.rainbow.client;
          public abstract class TextModule extends Module {
              public TextModule(String name, int x, int y) {
                  super(name, Category.HUD, true, x, y);
                  this.h = 13;
              }
              protected abstract String text();
              @Override public boolean isHud() { return true; }
              @Override public void render(boolean preview) {
                  String t = text();
                  w = mc.fontRendererObj.getStringWidth(t) + 10;
                  if (Settings.background) Gfx.rect(x, y, w, h, 0x90000000);
                  Gfx.rect(x, y, 2, h, Rainbow.color(0));
                  mc.fontRendererObj.drawStringWithShadow(t, x + 6, y + 3, 0xFFFFFFFF);
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/FpsModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.Minecraft;
          public class FpsModule extends TextModule {
              public FpsModule() { super("FPS", 6, 6); }
              @Override protected String text() { return "FPS: " + Minecraft.getDebugFPS(); }
          }
          EOF

          cat > src/main/java/com/rainbow/client/CpsModule.java <<'EOF'
          package com.rainbow.client;
          public class CpsModule extends TextModule {
              public CpsModule() { super("CPS", 6, 22); }
              @Override protected String text() { return "CPS: " + Cps.left() + " | " + Cps.right(); }
