          EOF

          cat > src/main/java/com/rainbow/client/PingModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.network.NetworkPlayerInfo;
          public class PingModule extends TextModule {
              public PingModule() { super("Ping", 6, 38); }
              @Override protected String text() {
                  int ping = 0;
                  if (mc.thePlayer != null && mc.getNetHandler() != null) {
                      NetworkPlayerInfo info = mc.getNetHandler().getPlayerInfo(mc.thePlayer.getUniqueID());
                      if (info != null) ping = info.getResponseTime();
                  }
                  return "Ping: " + ping + " ms";
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/CoordsModule.java <<'EOF'
          package com.rainbow.client;
          public class CoordsModule extends TextModule {
              public CoordsModule() { super("Coordinates", 6, 54); }
              @Override protected String text() {
                  if (mc.thePlayer == null) return "XYZ: 0 0 0";
                  return "XYZ: " + (int)Math.floor(mc.thePlayer.posX) + " "
                      + (int)Math.floor(mc.thePlayer.posY) + " " + (int)Math.floor(mc.thePlayer.posZ);
