          package com.rainbow.client;
          import java.io.IOException;
          import net.minecraft.client.gui.GuiScreen;
          import org.lwjgl.input.Keyboard;
          import org.lwjgl.input.Mouse;
          public class ModSettings extends GuiScreen {
              private static final int PW = 260, ROW = 20, SX = 130, SW = 90;
              private final Module module;
              private int px, py, ph, scroll;
              private NumSetting dragging;
              public ModSettings(Module module) { this.module = module; }
              private void calc() {
                  ph = Math.min(height - 20, 300);
                  px = width - PW - 10;
                  py = (height - ph) / 2;
              }
              private int visible() { return Math.max(1, (ph - 48) / ROW); }
              private void clamp() { scroll = Math.max(0, Math.min(scroll, Math.max(0, module.settings.size() - visible()))); }
              private void apply(NumSetting s, int mx) {
                  float r = (mx - (px + PW - SX)) / (float)SW;
                  r = Math.max(0f, Math.min(1f, r));
                  s.set(s.min + r * (s.max - s.min));
              }
              @Override public void drawScreen(int mx, int my, float partialTicks) {
                  Rainbow.update(); calc(); clamp();
                  if (dragging != null) {
                      if (Mouse.isButtonDown(0)) apply(dragging, mx);
                      else { dragging = null; Config.save(); }
                  }
                  Gfx.rect(px, py, PW, ph, 0xE0141720);
                  for (int i = 0; i < PW; i++) Gfx.rect(px + i, py, 1, 2, Rainbow.color((float)i / PW));
                  fontRendererObj.drawStringWithShadow(module.name + " Settings", px + 10, py + 9, 0xFFFFFFFF);
                  int top = py + 28;
                  for (int k = 0; k < visible(); k++) {
                      int idx = scroll + k;
                      if (idx >= module.settings.size()) break;
                      Setting s = module.settings.get(idx);
                      int yy = top + k * ROW;
                      Gfx.rect(px + 8, yy, PW - 16, ROW - 2, Gfx.in(mx, my, px + 8, yy, PW - 16, ROW - 2) ? 0xFF2A2F3A : 0xFF20232A);
                      fontRendererObj.drawString(s.name, px + 14, yy + 6, 0xFFFFFFFF);
                      if (s instanceof BoolSetting) {
                          boolean on = ((BoolSetting)s).value;
                          String t = on ? "ON" : "OFF";
                          fontRendererObj.drawString(t, px + PW - 14 - fontRendererObj.getStringWidth(t), yy + 6,
                              on ? Rainbow.color(k * 0.08f) : 0xFF888888);
                      } else if (s instanceof NumSetting) {
                          NumSetting n = (NumSetting)s;
                          int sx = px + PW - SX;
                          float r = (n.value - n.min) / (n.max - n.min);
                          Gfx.rect(sx, yy + 8, SW, 2, 0xFF444750);
                          Gfx.rect(sx, yy + 8, (int)(SW * r), 2, Rainbow.color(k * 0.08f));
                          Gfx.rect(sx + (int)(SW * r) - 2, yy + 4, 4, 10, 0xFFFFFFFF);
                          String v = n.step >= 1f ? Integer.toString((int)n.value) : String.format("%.2f", n.value);
                          fontRendererObj.drawString(v, sx + SW + 8, yy + 6, 0xFFAAAAAA);
                      }
                  }
                  drawCenteredString(fontRendererObj, "ESC: back  |  scroll for more", px + PW / 2, py + ph - 12, 0xFF777777);
                  super.drawScreen(mx, my, partialTicks);
              }
              @Override protected void mouseClicked(int mx, int my, int button) throws IOException {
                  calc();
                  int top = py + 28;
                  if (button == 0 && my >= top && mx >= px + 8 && mx < px + PW - 8) {
                      int k = (my - top) / ROW;
                      int idx = scroll + k;
                      if (k < visible() && idx < module.settings.size()) {
                          Setting s = module.settings.get(idx);
                          if (s instanceof BoolSetting) {
                              ((BoolSetting)s).value = !((BoolSetting)s).value;
                              Config.save();
                              return;
                          }
                          if (s instanceof NumSetting && mx >= px + PW - SX - 6 && mx <= px + PW - SX + SW + 6) {
                              dragging = (NumSetting)s;
                              apply(dragging, mx);
                              return;
                          }
                      }
                  }
                  super.mouseClicked(mx, my, button);
              }
              @Override public void handleMouseInput() throws IOException {
                  super.handleMouseInput();
                  int wheel = Mouse.getEventDWheel();
                  if (wheel != 0) { scroll += wheel > 0 ? -1 : 1; clamp(); }
              }
              @Override protected void keyTyped(char typedChar, int keyCode) throws IOException {
                  if (keyCode == Keyboard.KEY_ESCAPE) { mc.displayGuiScreen(new ModMenu()); return; }
                  if (keyCode == RainbowClient.menuKey.getKeyCode()) { mc.displayGuiScreen(null); return; }
                  super.keyTyped(typedChar, keyCode);
              }
              @Override public void onGuiClosed() { Config.save(); }
              @Override public boolean doesGuiPauseGame() { return false; }
          }
