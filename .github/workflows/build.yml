          cat > src/main/java/com/rainbow/client/ClockModule.java <<'EOF'
          package com.rainbow.client;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          public class ClockModule extends TextModule {
              private final BoolSetting twentyFour = bool("24 Hour", true);
              private final SimpleDateFormat f24 = new SimpleDateFormat("HH:mm:ss");
              private final SimpleDateFormat f12 = new SimpleDateFormat("hh:mm:ss a");
              private final Date date = new Date();
              private long lastSec = -1;
              private boolean lastMode = true;
              public ClockModule() { super("Clock", 6, 70); }
              @Override public void onTick() {
                  long ms = System.currentTimeMillis();
                  long sec = ms / 1000L;
                  if (sec == lastSec && twentyFour.value == lastMode) return;
                  lastSec = sec; lastMode = twentyFour.value;
                  date.setTime(ms);
                  set((lastMode ? f24 : f12).format(date));
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/KeystrokesModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.renderer.GlStateManager;
          import net.minecraft.client.settings.GameSettings;
          public class KeystrokesModule extends Module {
              private static final String[] KEYS = {"W", "A", "S", "D", "LMB", "RMB", "SPACE"};
              private final NumSetting size = num("Key Size", 22, 14, 34, 1);
              private final NumSetting gap = num("Gap", 2, 0, 8, 1);
              private final NumSetting opacity = num("Opacity", 144, 0, 255, 5);
              private final NumSetting thickness = num("Border Size", 1, 1, 3, 1);
              private final BoolSetting rainbowBorder = bool("Rainbow Border", true);
              private final BoolSetting rainbowPress = bool("Rainbow Pressed", false);
              private final BoolSetting fade = bool("Fade Animation", true);
              private final BoolSetting showCps = bool("CPS on Mouse", true);
              private final BoolSetting[] show = new BoolSetting[7];
              private final BoolSetting[] border = new BoolSetting[7];
              private final float[] anim = new float[7];
              private final int[] kx = new int[7], ky = new int[7], kw = new int[7], kh = new int[7], lw = new int[7];
              private final boolean[] vis = new boolean[7];
              private long lastNs = System.nanoTime();
              private String lcps = "0", rcps = "0";
              private int lastL = -1, lastR = -1, lcw, rcw;

              public KeystrokesModule() {
                  super("Keystrokes", Category.HUD, true, true, 6, 90);
                  for (int i = 0; i < 7; i++) show[i] = bool("Show " + KEYS[i], true);
                  for (int i = 0; i < 7; i++) border[i] = bool("Border " + KEYS[i], true);
                  this.w = 70; this.h = 80;
              }

              @Override public void onTick() {
                  int l = Cps.left(), r = Cps.right();
                  if (l != lastL) { lastL = l; lcps = Integer.toString(l); lcw = mc.fontRendererObj.getStringWidth(lcps); }
                  if (r != lastR) { lastR = r; rcps = Integer.toString(r); rcw = mc.fontRendererObj.getStringWidth(rcps); }
              }

              private void place(int i, int x, int y, int w, int h) { kx[i] = x; ky[i] = y; kw[i] = w; kh[i] = h; }

              private boolean down(GameSettings g, int i) {
                  switch (i) {
                      case 0: return g.keyBindForward.isKeyDown();
                      case 1: return g.keyBindLeft.isKeyDown();
                      case 2: return g.keyBindBack.isKeyDown();
                      case 3: return g.keyBindRight.isKeyDown();
                      case 4: return g.keyBindAttack.isKeyDown();
                      case 5: return g.keyBindUseItem.isKeyDown();
                      default: return g.keyBindJump.isKeyDown();
                  }
              }

              @Override protected void renderLocal(boolean preview) {
                  GameSettings g = mc.gameSettings;
                  int k = (int)size.value, gp = (int)gap.value, total = k * 3 + gp * 2;
                  int sh = Math.max(10, k * 6 / 10);
                  for (int i = 0; i < 7; i++) vis[i] = show[i].value;
                  int cy = 0;
                  if (vis[0]) { place(0, k + gp, cy, k, k); cy += k + gp; }
                  if (vis[1] || vis[2] || vis[3]) {
                      place(1, 0, cy, k, k); place(2, k + gp, cy, k, k); place(3, 2 * (k + gp), cy, k, k);
                      cy += k + gp;
                  }
                  if (vis[4] || vis[5]) {
                      int l = (total - gp) / 2, r = total - gp - l;
                      place(4, 0, cy, l, k); place(5, l + gp, cy, r, k);
                      cy += k + gp;
                  }
                  if (vis[6]) { place(6, 0, cy, total, sh); cy += sh + gp; }
                  w = total; h = Math.max(0, cy - gp);
                  if (h == 0) return;

                  long now = System.nanoTime();
                  float dt = (now - lastNs) / 1000000f;
                  lastNs = now;
                  if (dt > 100f) dt = 100f;
                  float st = fade.value ? Math.min(1f, dt / 60f) : 1f;
                  int base = ((int)opacity.value) << 24;
                  int bt = (int)thickness.value;
                  float invW = 1f / Math.max(1, w), invH = 1f / Math.max(1, h);

                  // pass 1: all rectangles in a single batched draw call
                  Gfx.begin();
                  for (int i = 0; i < 7; i++) {
                      if (!vis[i]) continue;
                      float target = (!preview && down(g, i)) ? 1f : 0f;
                      anim[i] += (target - anim[i]) * st;
                      if (Math.abs(target - anim[i]) < 0.01f) anim[i] = target;
                      float off = kx[i] * invW * 0.6f + ky[i] * invH * 0.3f;
                      int pc = rainbowPress.value ? ((Rainbow.color(off) & 0x00FFFFFF) | 0xD0000000) : 0xD0FFFFFF;
                      Gfx.quad(kx[i], ky[i], kw[i], kh[i], Gfx.lerp(base, pc, anim[i]));
                      if (i == 6) {
                          int bw = kw[i] / 3;
                          Gfx.quad(kx[i] + (kw[i] - bw) / 2, ky[i] + kh[i] / 2, bw, 1, Gfx.lerp(0xFFFFFFFF, 0xFF000000, anim[i]));
                      }
                      if (border[i].value)
                          Gfx.frame(kx[i], ky[i], kw[i], kh[i], bt, rainbowBorder.value ? Rainbow.color(off) : 0xB0FFFFFF);
                  }
                  Gfx.end();

                  // pass 2: text
                  for (int i = 0; i < 6; i++) {
                      if (!vis[i]) continue;
                      if (lw[i] == 0) lw[i] = mc.fontRendererObj.getStringWidth(KEYS[i]);
                      int tc = Gfx.lerp(0xFFFFFFFF, 0xFF000000, anim[i]);
                      boolean cp = showCps.value && i >= 4 && kh[i] >= 20;
                      int ty = cp ? ky[i] + (kh[i] - 15) / 2 : ky[i] + (kh[i] - 8) / 2;
                      mc.fontRendererObj.drawString(KEYS[i], kx[i] + (kw[i] - lw[i]) / 2, ty, tc);
                      if (cp) {
                          int cw = i == 4 ? lcw : rcw;
                          GlStateManager.pushMatrix();
                          GlStateManager.translate(kx[i] + kw[i] / 2f, (float)(ty + 9), 0f);
                          GlStateManager.scale(0.75f, 0.75f, 1f);
                          mc.fontRendererObj.drawString(i == 4 ? lcps : rcps, -cw / 2, 0,
                              Gfx.lerp(0xFFAAAAAA, 0xFF444444, anim[i]));
                          GlStateManager.popMatrix();
                      }
                  }
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/ArmorModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.renderer.RenderHelper;
          import net.minecraft.item.ItemStack;
          public class ArmorModule extends Module {
              private final BoolSetting durability = bool("Show Durability", true);
              private final BoolSetting held = bool("Show Held Item", true);
              private final ItemStack[] stacks = new ItemStack[5];
              private final String[] dur = new String[5];
              private final int[] lastDur = {-1, -1, -1, -1, -1};
              public ArmorModule() {
                  super("Armor Status", Category.HUD, true, true, 6, 172);
                  this.w = 46; this.h = 90;
              }
              @Override public void onTick() {
                  for (int row = 0; row < 5; row++) {
                      ItemStack s = null;
                      if (mc.thePlayer != null)
                          s = row < 4 ? mc.thePlayer.inventory.armorInventory[3 - row] : mc.thePlayer.inventory.getCurrentItem();
                      stacks[row] = s;
                      if (s != null && s.isItemStackDamageable()) {
                          int left = s.getMaxDamage() - s.getItemDamage();
                          if (left != lastDur[row]) { lastDur[row] = left; dur[row] = Integer.toString(left); }
                      } else { dur[row] = null; lastDur[row] = -1; }
                  }
              }
              @Override protected void renderLocal(boolean preview) {
                  int rows = held.value ? 5 : 4;
                  w = durability.value ? 46 : 20;
                  h = rows * 18;
                  RenderHelper.enableGUIStandardItemLighting();
                  for (int row = 0; row < rows; row++) {
                      ItemStack s = stacks[row];
                      if (s == null) continue;
                      mc.getRenderItem().renderItemAndEffectIntoGUI(s, 0, row * 18);
                      mc.getRenderItem().renderItemOverlayIntoGUI(mc.fontRendererObj, s, 0, row * 18, null);
                  }
                  RenderHelper.disableStandardItemLighting();
                  if (!durability.value) return;
                  for (int row = 0; row < rows; row++)
                      if (dur[row] != null) mc.fontRendererObj.drawStringWithShadow(dur[row], 20, row * 18 + 4, 0xFFFFFFFF);
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/SprintModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.settings.KeyBinding;
          import org.lwjgl.input.Keyboard;
          public class SprintModule extends Module {
              private boolean held;
              public SprintModule() { super("Toggle Sprint", Category.MOVEMENT, false, true, 0, 0); }
              @Override public void onTick() {
                  int code = mc.gameSettings.keyBindSprint.getKeyCode();
                  boolean want = enabled && mc.thePlayer != null && mc.currentScreen == null
                      && mc.gameSettings.keyBindForward.isKeyDown() && !mc.thePlayer.isSneaking();
                  if (want) {
                      KeyBinding.setKeyBindState(code, true);
                      held = true;
                  } else if (held) {
                      KeyBinding.setKeyBindState(code, code > 0 && Keyboard.isKeyDown(code));
                      held = false;
                  }
              }
          }
          EOF

          cat > src/main/java/com/rainbow/client/ZoomModule.java <<'EOF'
          package com.rainbow.client;
          import net.minecraft.client.settings.KeyBinding;
          import org.lwjgl.input.Keyboard;
          public class ZoomModule extends Module {
              public static final KeyBinding KEY = new KeyBinding("Rainbow Client: Zoom", Keyboard.KEY_C, "Rainbow Client");
              private final NumSetting factor = num("Zoom Factor", 0.3f, 0.1f, 0.8f, 0.05f);
              private final BoolSetting smooth = bool("Smooth Camera", true);
              private boolean zooming;
              private float savedFov;
              private boolean savedSmooth;
              public ZoomModule() { super("Zoom", Category.RENDER, false, true, 0, 0); }
              @Override public void onTick() {
                  boolean want = enabled && mc.thePlayer != null && mc.currentScreen == null && KEY.isKeyDown();
                  if (want && !zooming) {
                      savedFov = mc.gameSettings.fovSetting;
                      savedSmooth = mc.gameSettings.smoothCamera;
                      zooming = true;
                  }
                  if (want) {
                      mc.gameSettings.fovSetting = Math.max(5.0f, savedFov * factor.value);
                      mc.gameSettings.smoothCamera = smooth.value;
                  } else if (zooming) {
                      mc.gameSettings.fovSetting = savedFov;
                      mc.gameSettings.smoothCamera = savedSmooth;
                      zooming = false;
                  }
              }
          }
