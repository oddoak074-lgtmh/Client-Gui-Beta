name: Build Zhwii Client (Forge 1.8.9)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  MOD_NAME: ZhwiiClient
  MOD_VERSION: 1.0.0
  MC_VERSION: 1.8.9

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 8 (bat buoc cho ForgeGradle 2.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare Gradle 2.14.1 (dung gradlew neu co)
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
            unzip -q gradle-2.14.1-bin.zip -d "$HOME/gradle"
            echo "GRADLE_CMD=$HOME/gradle/gradle-2.14.1/bin/gradle" >> "$GITHUB_ENV"
          fi

      - name: Setup Forge workspace
        run: $GRADLE_CMD setupCIWorkspace --no-daemon

      - name: Build
        run: $GRADLE_CMD clean build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-${{ env.MOD_VERSION }}-forge-${{ env.MC_VERSION }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Zhwii Client ${{ env.MOD_VERSION }} (Forge ${{ env.MC_VERSION }})
          files: build/libs/*.jar
